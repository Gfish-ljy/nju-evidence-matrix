name: Validate mock data

on:
  pull_request:
    paths:
      - 'mock/**'
      - 'backend/**'
      - 'tests/**'
      - 'docs/schema_v0.json'
      - '.github/workflows/validate-mock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mock/requirements-validation.txt
      - run: python mock/validate.py

      - run: python -m unittest discover -s tests -v
